<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover" />
    <meta name="theme-color" content="#1a1a2e" />

    <title>方块推理 · 小游戏中心</title>

    <link rel="stylesheet" href="style.css" />

    <!-- <link rel="manifest" href="manifest.json" /> -->
  </head>

  <body>
    <button class="platform-back" type="button" data-back-home>← 返回首页</button>

    <!-- 首页 -->

    <div id="home" class="page">
      <h1>🧩 方块推理</h1>

      <p>Nonogram 数织挑战</p>

      <button onclick="startGame()">▶ 开始游戏</button>

      <button onclick="showLevels()">📚 关卡</button>

      <button onclick="dailyGame()">🔥 每日挑战</button>

      <button onclick="showRank()">🏆 排行榜</button>
    </div>

    <!-- 游戏页面 -->

    <div id="gamePage" class="page hidden">
      <div class="topbar">
        <button onclick="backHome()">⬅</button>

        <h2>方块推理</h2>
      </div>

      <div class="status">
        <div>
          生命:

          <span id="life"> ❤️❤️❤️❤️❤️ </span>
        </div>

        <div>
          时间:

          <span id="timer"> 00:00 </span>
        </div>
      </div>

      <div class="tools">
        <button onclick="useHammer()">
          🔨
          <span id="hammerCount"> 3 </span>
        </button>

        <button onclick="usePlane()">
          ✈️
          <span id="planeCount"> 1 </span>
        </button>

        <button onclick="useMagnet()">
          🧲
          <span id="magnetCount"> 1 </span>
        </button>

        <button onclick="aiHint()">🤖</button>
      </div>

      <div class="board-wrapper">
        <div id="colHints" class="col-hints"></div>

        <div class="main-board">
          <div id="rowHints" class="row-hints"></div>

          <div id="board" class="board"></div>
        </div>
      </div>

      <div id="message"></div>
      <p style="margin-top:8px;color:#94a3b8;font-size:13px;text-align:center;max-width:520px;line-height:1.5;">
        操作：单击填充 ■；右键/长按标记 ×。<br>
        点错会扣生命，并立刻标红显示该格正确答案。
      </p>
    </div>

    <!-- 关卡页面 -->

    <div id="levelPage" class="page hidden">
      <h2>📚 关卡</h2>

      <div id="levels"></div>

      <button onclick="backHome()">返回</button>
    </div>

    <!-- 排行榜 -->

    <div id="rankPage" class="page hidden">
      <h2>🏆 排行榜</h2>

      <div id="rankList"></div>

      <button onclick="backHome()">返回</button>
    </div>

    <script src="../../js/common.js"></script>
    <script src="levels.js"></script>

    <script src="storage.js"></script>

    <script src="solver.js"></script>

    <script src="game.js"></script>
  </body>
</html>
