<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover" />
    <meta name="theme-color" content="#1a1a2e" />

    <title>方块推理 · 小游戏中心</title>

    <link rel="stylesheet" href="style.css" />

    <!-- <link rel="manifest" href="manifest.json" /> -->
  </head>

  <body>
    <button class="platform-back" type="button" data-back-home>← 返回首页</button>

    <!-- 首页 -->

    <div id="home" class="page">
      <h1>🧩 方块推理</h1>

      <p>15×15 数织 · 随机 50~160 方块 · 经典 / 草方块 / 除冰</p>

      <button onclick="startGame('classic')">▶ 经典模式</button>
      <button onclick="startGrassMode()">🌿 草方块模式</button>
      <button onclick="startIceMode()">🧊 除冰模式</button>
      <button onclick="showLevels('classic')">📚 经典关卡</button>
      <button onclick="showLevels('grass')">📚 草地方关卡</button>
      <button onclick="showLevels('ice')">📚 除冰关卡</button>
      <button onclick="dailyGame('classic')">🔥 每日经典</button>
      <button onclick="dailyGame('grass')">🔥 每日草地</button>
      <button onclick="dailyGame('ice')">🔥 每日除冰</button>
      <button onclick="showRank()">🏆 排行榜</button>
    </div>

    <!-- 游戏页面 -->

    <div id="gamePage" class="page hidden">
      <div class="topbar">
        <button onclick="backHome()" type="button">⬅</button>
        <h2 id="gameTitle">方块推理</h2>
        <span id="modeBadge" class="mode-badge" data-mode="classic">经典模式</span>
      </div>

      <div class="status">
        <div>关卡: <span id="stageLabel">1</span></div>
        <div>方块: <span id="blockCount">-</span></div>
        <div>生命: <span id="life">❤️❤️❤️❤️❤️</span></div>
        <div>时间: <span id="timer">00:00</span></div>
      </div>

      <div class="tools">
        <button onclick="useHammer()">
          🔨
          <span id="hammerCount"> 3 </span>
        </button>

        <button onclick="usePlane()">
          ✈️
          <span id="planeCount"> 1 </span>
        </button>

        <button onclick="useMagnet()">
          🧲
          <span id="magnetCount"> 1 </span>
        </button>

        <button onclick="aiHint()">🤖</button>
      </div>

      <div class="board-wrapper">
        <div class="game-board">
          <div class="top-area">
            <div id="colHints" class="col-hints"></div>
          </div>
          <div class="main-board">
            <div id="rowHints" class="row-hints"></div>
            <div id="board" class="board"></div>
          </div>
        </div>
      </div>

      <p class="hint-legend">
        <span><strong>行数字</strong>：从左到右的连续实心段</span>
        <span><strong>列数字</strong>：从上到下的连续实心段</span>
      </p>
      <div id="message"></div>
      <div id="nextLevelBar" class="next-level-bar hidden">
        <button type="button" id="nextLevelBtn" onclick="nextLevel()">下一关 →</button>
      </div>
      <p id="modeTip" class="mode-tip">
        操作：单击填充 ■；右键/长按标记 ×。<br>
        点错会扣生命，并立刻标红显示该格正确答案。
      </p>
    </div>

    <!-- 关卡页面 -->

    <div id="levelPage" class="page hidden">
      <h2>📚 关卡</h2>

      <div id="levels"></div>

      <button onclick="backHome()">返回</button>
    </div>

    <!-- 排行榜 -->

    <div id="rankPage" class="page hidden">
      <h2>🏆 排行榜</h2>

      <div id="rankList"></div>

      <button onclick="backHome()">返回</button>
    </div>

    <script src="../../js/common.js"></script>
    <script src="levels.js"></script>

    <script src="storage.js"></script>

    <script src="solver.js"></script>

    <script src="game.js"></script>
  </body>
</html>
