<!DOCTYPE html>
<html lang="zh-CN">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>15×15 数织 — 草方块 / 冰方块 / 普通模式</title>
<link rel="stylesheet" href="style.css">
<script src="game.js"></script>
</head>

<body>

<div id="loading-overlay" class="loading-overlay">
  <div class="loading-content">
    <div style="font-size:18px;margin-bottom:12px;color:#22c55e;">正在加载 15×15 数织...</div>
    <div class="loading-text">正在生成关卡...</div>
    <div class="progress-container">
      <div id="progress-bar" class="progress-bar"></div>
    </div>
    <div id="progress-text" style="margin-top:8px;font-size:14px;color:#aaa;">0%</div>
  </div>
</div>

<div class="toolbar">
  <div class="mode-toggle">
    <button id="btnModeGrass" class="mode-btn active">草方块</button>
    <button id="btnModeIce" class="mode-btn">冰方块</button>
    <button id="btnModeNormal" class="mode-btn">普通模式</button>
  </div>
  <div class="draw-mode-switch">
    <label class="switch">
      <input type="checkbox" id="xMode" checked>
      <span class="slider"></span>
    </label>
    <span>打X模式</span>
  </div>
  <input id="seedInput" type="text" placeholder="输入种子..." style="width: 160px; padding: 6px 10px; border-radius: 6px; border: 1px solid #555; background: #333; color: #eee; font-size: 13px;">
  <button id="btnLoadSeed" class="secondary">加载种子</button>
  <button id="btnGenerate" type="button">生成新关卡</button>
  <button id="btnReset" class="secondary" type="button">清空棋盘</button>
  <button id="btnRecords" class="secondary" type="button">生成记录</button>
  <button id="btnExport" class="secondary" type="button">导出文本</button>
  <button id="btnCopy" class="secondary" type="button">复制种子</button>
  <span id="status" class="status">准备生成…</span>
</div>

<div class="game-wrap">
  <div class="game">
    <div class="top-area">
      <div id="colHints" class="col-hints"></div>
    </div>

    <div class="main">
      <div id="rowHints" class="row-hints"></div>
      <div id="board" class="board"></div>
    </div>
  </div>
</div>

<div class="export-box">
  <div style="margin-bottom:6px;font-size:13px;color:#aaa;">
    点击下方按钮可导出当前关卡的纯文本解决方案（每行15个0/1，用空格分隔）
  </div>
  <textarea id="exportText" readonly></textarea>
</div>


</body>

</html>
