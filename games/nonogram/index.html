<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>方块推理 · 数织挑战</title>
  <link rel="stylesheet" href="style.css?v=20260811-3">
  <script src="game.js?v=20260811-3" defer></script>
</head>

<body>
  <div id="loading-overlay" class="loading-overlay" aria-live="polite">
    <div class="loading-content">
      <span class="loading-mark" aria-hidden="true"></span>
      <strong>正在生成关卡</strong>
      <span>请稍候</span>
    </div>
  </div>

  <main class="page-shell">
    <header class="game-header">
      <div>
        <p class="eyebrow">NONOGRAM / 15 × 15</p>
        <h1>方块推理</h1>
        <p class="subtitle">用行列线索还原隐藏图案</p>
      </div>
      <div class="header-note" aria-label="操作提示">
        <span class="legend-chip legend-fill">■</span>
        <span>填充</span>
        <span class="legend-chip legend-cross">×</span>
        <span>排除</span>
      </div>
    </header>

    <section class="control-panel" aria-label="关卡控制">
      <div class="control-row primary-controls">
        <fieldset class="mode-toggle">
          <legend>模式</legend>
          <button id="btnModeGrass" class="mode-btn active" type="button">草方块</button>
          <button id="btnModeIce" class="mode-btn" type="button">冰方块</button>
          <button id="btnModeNormal" class="mode-btn" type="button">普通模式</button>
        </fieldset>

        <label class="toggle-control" for="xMode">
          <input id="xMode" type="checkbox" checked>
          <span class="toggle-track" aria-hidden="true"><span></span></span>
          <span>长按标记 ×</span>
        </label>
      </div>

      <div class="control-row secondary-controls">
        <div class="seed-control">
          <label for="seedInput">关卡码</label>
          <input id="seedInput" type="text" placeholder="模式:种子，如 0:12345" autocomplete="off">
          <button id="btnLoadSeed" class="button button-muted" type="button">加载</button>
        </div>
        <div class="action-group">
          <button id="btnGenerate" class="button button-primary" type="button">生成新关卡</button>
          <button id="btnReset" class="button button-muted" type="button">清空棋盘</button>
          <button id="btnRecords" class="button button-muted" type="button">生成记录</button>
          <button id="btnCopy" class="button button-muted" type="button">复制关卡码</button>
        </div>
      </div>

      <p id="status" class="status" role="status">准备生成关卡</p>
    </section>

    <section class="game-layout" aria-label="数织棋盘">
      <div class="game-stage">
        <div class="game-wrap">
          <div class="game">
            <div class="top-area">
              <div id="colHints" class="col-hints" aria-label="列提示"></div>
            </div>
            <div class="main">
              <div id="rowHints" class="row-hints" aria-label="行提示"></div>
              <div id="board" class="board" aria-label="数织棋盘"></div>
            </div>
          </div>
        </div>
      </div>

      <aside class="help-panel">
        <div class="help-heading">
          <span class="section-kicker">PLAY GUIDE</span>
          <h2>本局提示</h2>
        </div>
        <ul>
          <li><span class="help-icon fill-icon">■</span><span>点击格子填充方块</span></li>
          <li><span class="help-icon cross-icon">×</span><span>右键或长按标记空格</span></li>
          <li><span class="help-icon terrain-icon">◆</span><span>特殊方块需先解锁</span></li>
        </ul>
        <div class="help-footer">行提示从左到右，列提示从上到下</div>
      </aside>
    </section>
  </main>
</body>

</html>
