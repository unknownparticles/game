<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>方块推理 · 数织挑战</title>
  <link rel="stylesheet" href="style.css?v=20261011-2">
  <script src="game.js?v=20261011-2" defer></script>
</head>

<body>
  <!-- 背景动态装饰云层 -->
  <div class="sky-clouds" aria-hidden="true">
    <div class="cloud cloud-1"></div>
    <div class="cloud cloud-2"></div>
    <div class="cloud cloud-3"></div>
  </div>

  <!-- 加载遮罩 -->
  <div id="loading-overlay" class="loading-overlay" aria-live="polite">
    <div class="loading-card">
      <div class="ice-loading-spinner" id="loadingSpinner"></div>
      <strong>正在生成关卡...</strong>
      <span>请稍候</span>
    </div>
  </div>

  <main class="game-container">
    <!-- 顶部状态栏（参考参考图：生命值、计时器、关卡与功能按钮） -->
    <header class="top-bar" aria-label="游戏状态">
      <div class="top-left">
        <a href="../../index.html" class="icon-pill-btn home-btn" title="返回游戏中心">
          <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        </a>
        <div id="livesContainer" class="stat-pill lives-pill" title="生命值">
          <span class="heart active"></span>
          <span class="heart active"></span>
          <span class="heart active"></span>
        </div>
        <div id="timerContainer" class="stat-pill timer-pill" title="用时">
          <svg class="pill-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 15"/></svg>
          <span id="timerText">00:00</span>
        </div>
      </div>

      <div class="top-center">
        <div id="levelBadge" class="stat-pill level-pill" title="当前关卡">第 1 关 · 除冰模式</div>
      </div>

      <div class="top-right">
        <button id="btnSound" class="icon-pill-btn" type="button" title="开关音效">
          <svg id="soundIconOn" viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
          <svg id="soundIconOff" viewBox="0 0 24 24" fill="currentColor" width="18" height="18" hidden><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27l4.73 4.73H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
        </button>
        <button id="btnInfo" class="icon-pill-btn" type="button" title="关卡规则与信息">
          <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
        </button>
      </div>
    </header>

    <!-- 模式选择快捷切换栏 -->
    <nav class="mode-bar" aria-label="游戏模式切换">
      <button id="btnModeIce" class="mode-tab active" type="button">
        <span class="tab-icon ice-tab-icon"></span>
        <span>冰方块 (除冰)</span>
      </button>
      <button id="btnModeGrass" class="mode-tab" type="button">
        <span class="tab-icon grass-tab-icon"></span>
        <span>草方块 (除草)</span>
      </button>
      <button id="btnModeNormal" class="mode-tab" type="button">
        <span class="tab-icon normal-tab-icon"></span>
        <span>普通模式</span>
      </button>
    </nav>

    <!-- 游戏状态提示文字 -->
    <div class="status-banner">
      <p id="status" class="status" role="status">准备生成关卡</p>
    </div>

    <!-- 核心棋盘区域 -->
    <section class="game-stage" aria-label="数织棋盘舞台">
      <div class="board-outer-frame">
        <div class="game-wrap">
          <div class="game-grid-container">
            <!-- 顶部列提示 -->
            <div class="top-area">
              <div id="colHints" class="col-hints" aria-label="列提示"></div>
            </div>
            <!-- 主棋盘区（左侧行提示 + 15x15网格） -->
            <div class="main-area">
              <div id="rowHints" class="row-hints" aria-label="行提示"></div>
              <div id="board" class="board" aria-label="数织棋盘"></div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- 飞机目标选择悬浮浮层 -->
    <div id="planePicker" class="plane-picker-banner" hidden>
      <div class="plane-picker-box">
        <span class="plane-label">✈ 选择飞机揭示目标：</span>
        <select id="planeTarget" aria-label="选择揭示的行或列"></select>
        <button id="btnPlaneConfirm" class="button button-green" type="button">发射</button>
        <button id="btnPlaneCancel" class="button button-cancel" type="button">取消</button>
      </div>
    </div>

    <!-- 底部操作与道具栏（参考图底栏：模式切换开关 + 锤子 + 磁铁 + 飞机 + 菜单） -->
    <footer class="bottom-toolbar" aria-label="操作与道具">
      <!-- 填涂 / 排除模式切换滑块 -->
      <div class="mode-toggle-pill" id="actionSwitch" title="点击切换涂色 / 标记空格模式">
        <div class="toggle-indicator" id="toggleIndicator"></div>
        <button id="btnToggleCross" class="toggle-btn toggle-cross" type="button" aria-label="标记排除 ×">
          <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="6" y1="18" x2="18" y2="6"/></svg>
        </button>
        <button id="btnToggleFill" class="toggle-btn toggle-fill active" type="button" aria-label="填充方块 ■">
          <div class="fill-box-icon"></div>
        </button>
      </div>

      <!-- 道具按钮组 -->
      <div class="tools-group">
        <!-- 锤子道具 -->
        <button id="btnHammer" class="tool-btn hammer-btn" type="button" title="锤子：点击揭示任意一个普通格子">
          <div class="tool-icon-wrapper" id="hammerIcon"></div>
          <span class="tool-badge" id="hammerCount">3</span>
        </button>

        <!-- 磁铁道具 -->
        <button id="btnMagnet" class="tool-btn magnet-btn" type="button" title="磁铁：随机揭示最多3个未知格子">
          <div class="tool-icon-wrapper" id="magnetIcon"></div>
          <span class="tool-badge" id="magnetCount">1</span>
        </button>

        <!-- 飞机道具 -->
        <button id="btnPlane" class="tool-btn plane-btn" type="button" title="飞机：选择一行或一列全部揭示">
          <div class="tool-icon-wrapper" id="planeIcon"></div>
          <span class="tool-badge" id="planeCount">1</span>
        </button>

        <!-- 菜单/设置按钮 -->
        <button id="btnMenu" class="tool-btn menu-btn" type="button" title="设置与功能菜单">
          <div class="tool-icon-wrapper menu-icon-wrap">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="#fff"><rect x="4" y="5" width="16" height="2.8" rx="1.4"/><rect x="4" y="10.6" width="16" height="2.8" rx="1.4"/><rect x="4" y="16.2" width="16" height="2.8" rx="1.4"/></svg>
          </div>
        </button>
      </div>
    </footer>
  </main>

  <!-- 关卡信息弹窗 (参考图 IMG_5204 / IMG_5222 风格) -->
  <div id="modalInfo" class="game-modal-overlay" hidden>
    <div class="cartoon-modal-card">
      <button class="modal-close-btn" id="btnCloseInfo" type="button" aria-label="关闭">×</button>
      <div class="modal-ribbon-header">
        <h2>关卡信息</h2>
      </div>

      <div class="modal-showcase-box" id="infoShowcaseBox">
        <div class="showcase-rays" aria-hidden="true"></div>
        <div class="showcase-badge" id="infoBadgeText">除冰模式</div>
        <div class="showcase-preview-icon" id="infoPreviewIcon"></div>
        <p class="showcase-tip" id="infoTipText">点亮冰块四周的4个格子可以去除冰块</p>
      </div>

      <div class="modal-info-list">
        <div class="info-item">
          <span class="item-label">格子数量</span>
          <span class="item-val">15 × 15</span>
        </div>
        <div class="info-item">
          <span class="item-label">关卡难度</span>
          <span class="item-val highlight-diff">极难</span>
        </div>
        <div class="info-item">
          <span class="item-label">冰块机制</span>
          <span class="item-val">4种破损状态</span>
        </div>
      </div>

      <div class="modal-action-row">
        <button id="btnStartGame" class="cartoon-btn-large green-bounce-btn" type="button">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="#ffe600"><path d="M7 2v11h3v9l7-12h-4l4-8z"/></svg>
          <span>开始挑战</span>
        </button>
      </div>
    </div>
  </div>

  <!-- 菜单与设置抽屉/弹窗 -->
  <div id="modalMenu" class="game-modal-overlay" hidden>
    <div class="cartoon-modal-card menu-card">
      <button class="modal-close-btn" id="btnCloseMenu" type="button" aria-label="关闭">×</button>
      <div class="modal-ribbon-header orange-ribbon">
        <h2>游戏设置</h2>
      </div>

      <div class="menu-content-body">
        <div class="menu-btn-grid">
          <button id="btnMenuNewGame" class="cartoon-menu-btn btn-action-primary" type="button">
            <span>🎲 生成新关卡</span>
          </button>
          <button id="btnMenuReset" class="cartoon-menu-btn btn-action-warn" type="button">
            <span>🧹 清空当前棋盘</span>
          </button>
        </div>

        <div class="seed-card-box">
          <label for="seedInput">关卡码（种子）</label>
          <div class="seed-input-row">
            <input id="seedInput" type="text" placeholder="如 1:8829103" autocomplete="off">
            <button id="btnLoadSeed" class="cartoon-small-btn" type="button">加载</button>
          </div>
          <button id="btnCopySeed" class="copy-seed-link" type="button">📋 复制当前关卡码</button>
        </div>

        <div class="guide-mini-box">
          <strong>💡 玩法提示</strong>
          <p>• 数字代表该行或列中连续填色方块的数量。</p>
          <p>• <b>除冰模式</b>：点亮冰块四周的4个邻格，冰块会经历<b>完整 → 破损1/4 → 破损1/2 → 破损3/4 → 彻底消除</b>！</p>
          <p>• <b>除草模式</b>：点亮草丛四周的任意格子即可去除草丛。</p>
        </div>
      </div>
    </div>
  </div>

  <!-- 胜利通关弹窗 (参考图 IMG_5203 风格) -->
  <div id="modalWin" class="game-modal-overlay" hidden>
    <div class="cartoon-modal-card win-modal-card">
      <div class="win-crown-decor" id="winCrownDecor" aria-hidden="true"></div>
      <div class="modal-ribbon-header gold-ribbon">
        <h2>恭喜通关！</h2>
      </div>

      <div class="win-artwork-frame">
        <div id="winArtMiniPreview" class="win-art-preview"></div>
      </div>

      <div class="win-stats-grid">
        <div class="win-stat-card">
          <span class="stat-name">通关时间</span>
          <strong class="stat-value" id="winTimeVal">01:24</strong>
        </div>
        <div class="win-stat-card">
          <span class="stat-name">正确涂色</span>
          <strong class="stat-value" id="winBlocksVal">--</strong>
        </div>
      </div>

      <div class="modal-action-row win-action-row">
        <button id="btnNextLevel" class="cartoon-btn-large green-bounce-btn" type="button">
          <span>下一关</span>
        </button>
      </div>
    </div>
  </div>
</body>

</html>
