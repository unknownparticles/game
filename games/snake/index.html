<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#0b1020" />
  <title>贪吃蛇 · 小游戏中心</title>
  <link rel="stylesheet" href="../../css/style.css" />
</head>
<body>
  <main class="game-shell">
    <div class="topbar">
      <button class="btn" type="button" data-back-home>← 返回首页</button>
      <h1>贪吃蛇</h1>
      <button class="btn btn-primary" id="restartBtn" type="button">重新开始</button>
    </div>

    <section class="panel">
      <div class="score-row">
        <div class="score-box"><span>得分</span><strong id="score">0</strong></div>
        <div class="score-box"><span>最高分</span><strong id="best">0</strong></div>
        <div class="score-box"><span>状态</span><strong id="state">准备中</strong></div>
      </div>
      <div class="canvas-wrap">
        <canvas id="board" width="360" height="360" aria-label="贪吃蛇游戏画布"></canvas>
      </div>
      <div class="controls" aria-label="方向控制">
        <span class="spacer"></span>
        <button class="btn" type="button" data-dir="up">上</button>
        <span class="spacer"></span>
        <button class="btn" type="button" data-dir="left">左</button>
        <button class="btn" type="button" data-dir="down">下</button>
        <button class="btn" type="button" data-dir="right">右</button>
      </div>
      <p class="hint">电脑：方向键 / WASD。手机：下方按钮或滑动屏幕。</p>
    </section>
  </main>

  <script src="../../js/common.js"></script>
  <script>
    const canvas = document.getElementById("board");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score");
    const bestEl = document.getElementById("best");
    const stateEl = document.getElementById("state");
    const grid = 18;
    const cell = canvas.width / grid;
    const BEST_KEY = "gc_snake_best";

    let snake, dir, nextDir, food, score, best, timer, running, touchStart;

    best = GameCenter.storage.get(BEST_KEY, 0);
    bestEl.textContent = best;

    function reset() {
      snake = [{ x: 8, y: 9 }, { x: 7, y: 9 }, { x: 6, y: 9 }];
      dir = { x: 1, y: 0 };
      nextDir = { ...dir };
      score = 0;
      running = true;
      scoreEl.textContent = "0";
      stateEl.textContent = "进行中";
      spawnFood();
      clearInterval(timer);
      timer = setInterval(tick, 110);
      draw();
    }

    function spawnFood() {
      do {
        food = {
          x: Math.floor(Math.random() * grid),
          y: Math.floor(Math.random() * grid),
        };
      } while (snake.some((s) => s.x === food.x && s.y === food.y));
    }

    function setDirection(nx, ny) {
      if (dir.x + nx === 0 && dir.y + ny === 0) return;
      nextDir = { x: nx, y: ny };
    }

    function tick() {
      if (!running) return;
      dir = nextDir;
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
      if (
        head.x < 0 || head.y < 0 || head.x >= grid || head.y >= grid ||
        snake.some((s) => s.x === head.x && s.y === head.y)
      ) {
        running = false;
        stateEl.textContent = "游戏结束";
        clearInterval(timer);
        draw(true);
        return;
      }
      snake.unshift(head);
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreEl.textContent = score;
        if (score > best) {
          best = score;
          bestEl.textContent = best;
          GameCenter.storage.set(BEST_KEY, best);
        }
        spawnFood();
      } else {
        snake.pop();
      }
      draw();
    }

    function draw(dead) {
      ctx.fillStyle = "#0a0f1d";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      for (let i = 0; i < grid; i++) {
        for (let j = 0; j < grid; j++) {
          if ((i + j) % 2 === 0) {
            ctx.fillStyle = "rgba(255,255,255,0.02)";
            ctx.fillRect(i * cell, j * cell, cell, cell);
          }
        }
      }
      ctx.fillStyle = "#f87171";
      roundRect(food.x * cell + 3, food.y * cell + 3, cell - 6, cell - 6, 6);
      snake.forEach((s, idx) => {
        ctx.fillStyle = idx === 0 ? (dead ? "#fbbf24" : "#34d399") : "rgba(52,211,153,0.75)";
        roundRect(s.x * cell + 2, s.y * cell + 2, cell - 4, cell - 4, 7);
      });
    }

    function roundRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
      ctx.fill();
    }

    const keyMap = {
      ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0],
      w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0],
      W: [0, -1], S: [0, 1], A: [-1, 0], D: [1, 0],
    };

    window.addEventListener("keydown", (e) => {
      const v = keyMap[e.key];
      if (!v) return;
      e.preventDefault();
      setDirection(v[0], v[1]);
    });

    document.querySelectorAll("[data-dir]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const map = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
        const v = map[btn.dataset.dir];
        setDirection(v[0], v[1]);
      });
    });

    canvas.addEventListener("touchstart", (e) => {
      const t = e.changedTouches[0];
      touchStart = { x: t.clientX, y: t.clientY };
    }, { passive: true });

    canvas.addEventListener("touchend", (e) => {
      if (!touchStart) return;
      const t = e.changedTouches[0];
      const dx = t.clientX - touchStart.x;
      const dy = t.clientY - touchStart.y;
      if (Math.abs(dx) < 18 && Math.abs(dy) < 18) return;
      if (Math.abs(dx) > Math.abs(dy)) setDirection(dx > 0 ? 1 : -1, 0);
      else setDirection(0, dy > 0 ? 1 : -1);
    }, { passive: true });

    document.getElementById("restartBtn").addEventListener("click", reset);
    reset();
  </script>
</body>
</html>
